name: Publish image

# Builds the Streamable HTTP server image, smoke-tests the built container, and
# (outside pull requests) pushes it to GitHub Container Registry with a signed
# build-provenance attestation.
#
#   pull_request   build + smoke only, never pushes
#   push to main   pushes ghcr.io/<owner>/production-master-mcp:sha-<short>
#   push v* tag    additionally pushes :<version> (e.g. :0.1.0)
#
# Deployments pin the immutable `sha-<short>` (or version) tag, never a moving
# one — there is deliberately no `latest`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/production-master-mcp

jobs:
  image:
    # ubuntu-latest, never the self-hosted fleet: this repo is public and
    # accepts third-party pull requests, so a self-hosted runner here would
    # let a fork execute arbitrary code on the owner's hardware.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image name (lowercase)
        id: name
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Build (local, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: production-master-mcp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The container contract a deployment relies on, checked against the
      # image that is about to be pushed rather than assumed from source:
      # it serves GET /health, rejects an unauthenticated POST /mcp, and
      # refuses to start at all without PM_API_URL.
      - name: Smoke-test the built container
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3000:3000 \
            -e PM_API_URL=http://127.0.0.1:9 production-master-mcp:smoke
          trap 'docker logs smoke || true; docker rm -f -v smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          body="$(curl -fsS http://127.0.0.1:3000/health)"
          echo "GET /health -> ${body}"
          [ "${body}" = '{"status":"ok"}' ] || { echo "::error::unexpected /health body"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","method":"tools/list","id":1}' \
            http://127.0.0.1:3000/mcp)"
          echo "POST /mcp without bearer -> ${code}"
          [ "${code}" = "401" ] || { echo "::error::expected 401 without a bearer, got ${code}"; exit 1; }
          set +e
          docker run --rm production-master-mcp:smoke
          rc=$?
          set -e
          echo "start without PM_API_URL -> exit ${rc}"
          [ "${rc}" -ne 0 ] || { echo "::error::container started without PM_API_URL"; exit 1; }

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - if: github.event_name != 'pull_request'
        name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo '```'
            echo "${TAGS}"
            echo "digest: ${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
